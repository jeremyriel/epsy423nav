<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Standalone source artwork. The interactive version lives inline in index.html.
       Edit shapes/colors here; keep the two in sync if you change the art. -->
  <defs>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dadc"/><stop offset="1" stop-color="#5a97b8"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/><stop offset="1" stop-color="#3f5aa6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b2e2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#eef4ee"/>

  <path d="M 1000 0 L 1000 720 L 690 720 C 700 600 640 520 700 430 C 760 340 700 240 760 150 C 800 90 780 40 830 0 Z" fill="url(#lakeGrad)"/>
  <text x="905" y="120" transform="rotate(-8 905 120)" font-size="18" font-weight="700" fill="#12495e" letter-spacing="2" text-anchor="middle">LAKE&#160;MICHIGAN</text>

  <path d="M 705 470 L 470 470 L 360 380 M 470 470 L 380 560" stroke="#7fb2c9" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#cdd8d0" stroke-width="4">
    <line x1="130" y1="0" x2="130" y2="720"/>
    <line x1="470" y1="0" x2="470" y2="720"/>
    <line x1="0" y1="250" x2="705" y2="250"/>
    <line x1="0" y1="560" x2="640" y2="560"/>
  </g>
  <path d="M 40 40 C 300 140 320 360 470 470 C 600 560 640 400 705 430" stroke="#f4a259" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 690 715 C 700 560 650 470 705 380 C 745 300 705 200 765 120 C 800 70 790 30 835 5" stroke="#d9c27a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 235 195 C 180 280 200 340 250 415 S 420 470 520 505 S 690 400 745 320" stroke="#163b36" stroke-width="3" fill="none" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.5"/>

  <!-- Storyworlds -->
  <g>
    <rect x="120" y="95" width="230" height="170" rx="22" fill="#0f766e" filter="url(#soft)"/>
    <g transform="translate(150 128)">
      <path d="M0 8 C10 2 24 2 32 8 L32 34 C24 28 10 28 0 34 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M32 8 C40 2 54 2 64 8 L64 34 C54 28 40 28 32 34 Z" fill="#ffffff" opacity="0.8"/>
      <line x1="32" y1="8" x2="32" y2="34" stroke="#1c6a5f" stroke-width="2"/>
    </g>
    <text x="235" y="210" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Storyworlds</text>
    <text x="235" y="238" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Weeks 1–4</text>
  </g>

  <!-- Audio -->
  <g>
    <rect x="130" y="360" width="230" height="170" rx="22" fill="#6a5acd" filter="url(#soft)"/>
    <g transform="translate(168 392)">
      <rect x="14" y="0" width="20" height="34" rx="10" fill="#fff"/>
      <path d="M4 22 a20 20 0 0 0 40 0" fill="none" stroke="#fff" stroke-width="4"/>
      <line x1="24" y1="42" x2="24" y2="52" stroke="#fff" stroke-width="4"/>
      <line x1="14" y1="52" x2="34" y2="52" stroke="#fff" stroke-width="4"/>
    </g>
    <text x="245" y="475" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Audio</text>
    <text x="245" y="503" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Weeks 5–8</text>
  </g>

  <!-- Video -->
  <g>
    <rect x="415" y="455" width="230" height="170" rx="22" fill="#b8452b" filter="url(#soft)"/>
    <g transform="translate(450 487)">
      <rect x="0" y="0" width="52" height="38" rx="8" fill="#fff"/>
      <path d="M20 9 L38 19 L20 29 Z" fill="#b8452b"/>
    </g>
    <text x="530" y="570" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Video</text>
    <text x="530" y="598" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Weeks 9–11</text>
  </g>

  <!-- Chicago 2125 -->
  <g>
    <rect x="640" y="235" width="250" height="180" rx="22" fill="url(#skyGrad)" filter="url(#soft)"/>
    <g transform="translate(672 262)">
      <rect x="0" y="20" width="14" height="26" fill="#fff"/>
      <rect x="18" y="8" width="14" height="38" fill="#fff"/>
      <rect x="36" y="16" width="14" height="30" fill="#fff"/>
      <rect x="54" y="2" width="12" height="44" fill="#fff"/>
      <path d="M60 2 L60 -8" stroke="#ffd166" stroke-width="3"/>
      <circle cx="60" cy="-11" r="3" fill="#ffd166"/>
    </g>
    <text x="765" y="352" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Chicago 2125</text>
    <text x="765" y="380" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Weeks 12–15</text>
  </g>

  <!-- Title card (top-most layer; solid box keeps road lines off the title) -->
  <rect x="20" y="6" width="702" height="74" rx="14" fill="#ffffff" stroke="#cfe0d8" stroke-width="1.5" filter="url(#soft)"/>
  <text x="42" y="40" font-size="22" font-weight="800" fill="#163b36">EPSY/CI 423 · Digital Environmental Storytelling &amp; Advocacy</text>
  <text x="42" y="63" font-size="15" font-weight="600" fill="#3f5f58">Click a district to explore its weekly modules</text>
</svg>
