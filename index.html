<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPSY/CI 423 Digital Environmental Storytelling &amp; Advocacy — Course Map</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" aria-label="Interactive course navigation map">

    <!-- ================= MAP ================= -->
    <div class="map-wrap">
      <svg
        id="course-map"
        viewBox="0 0 1000 720"
        preserveAspectRatio="xMidYMid meet"
        role="group"
        aria-labelledby="map-title map-desc">
        <title id="map-title">Map of EPSY/CI 423 Digital Environmental Storytelling &amp; Advocacy</title>
        <desc id="map-desc">
          A simplified map of the Chicago region divided into four districts:
          Storyworlds (Weeks 1 to 4), Audio (Weeks 5 to 8), Video (Weeks 9 to 11),
          and Chicago 2125 (Weeks 12 to 15). Select a district to view its weekly modules.
        </desc>

        <defs>
          <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"  stop-color="#a8dadc"/>
            <stop offset="1"  stop-color="#5a97b8"/>
          </linearGradient>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2b3a67"/>
            <stop offset="1" stop-color="#3f5aa6"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b2e2a" flood-opacity="0.18"/>
          </filter>
        </defs>

        <!-- Land -->
        <rect x="0" y="0" width="1000" height="720" fill="#eef4ee"/>

        <!-- Lake Michigan (east) -->
        <path d="M 1000 0 L 1000 720 L 690 720
                 C 700 600 640 520 700 430
                 C 760 340 700 240 760 150
                 C 800 90 780 40 830 0 Z"
              fill="url(#lakeGrad)"/>
        <text x="905" y="120" class="water-label" transform="rotate(-8 905 120)">LAKE&#160;MICHIGAN</text>

        <!-- Chicago River (simple fork) -->
        <path class="river" d="M 705 470 L 470 470 L 360 380 M 470 470 L 380 560"/>

        <!-- Basic roads -->
        <g class="roads">
          <line x1="130" y1="0" x2="130" y2="720"/>   <!-- N–S grid -->
          <line x1="470" y1="0" x2="470" y2="720"/>   <!-- N–S grid (Halsted-ish) -->
          <line x1="0" y1="250" x2="705" y2="250"/>   <!-- E–W grid -->
          <line x1="0" y1="560" x2="640" y2="560"/>   <!-- E–W grid -->
          <path d="M 40 40 C 300 140 320 360 470 470 C 600 560 640 400 705 430" class="expressway"/>
          <path class="lakeshore" d="M 690 715 C 700 560 650 470 705 380 C 745 300 705 200 765 120 C 800 70 790 30 835 5"/>
        </g>

        <!-- Course route: Storyworlds -> Audio -> Video -> Chicago 2125 -->
        <path class="route"
              d="M 235 195 C 180 280 200 340 250 415
                 S 420 470 520 505
                 S 690 400 745 320"/>

        <!-- ============ DISTRICTS (clickable) ============ -->

        <!-- STORYWORLDS -->
        <g class="district" data-section="storyworlds" tabindex="0" role="button"
           aria-label="Storyworlds. Weeks 1 to 4. Select to view weekly modules.">
          <rect class="zone sw" x="120" y="95" width="230" height="170" rx="22" filter="url(#soft)"/>
          <g class="icon" transform="translate(150 128)">
            <!-- open book -->
            <path d="M0 8 C10 2 24 2 32 8 L32 34 C24 28 10 28 0 34 Z" fill="#ffffff" opacity="0.95"/>
            <path d="M32 8 C40 2 54 2 64 8 L64 34 C54 28 40 28 32 34 Z" fill="#ffffff" opacity="0.8"/>
            <line x1="32" y1="8" x2="32" y2="34" stroke="#1c6a5f" stroke-width="2"/>
          </g>
          <text class="d-title" x="235" y="210">Storyworlds</text>
          <text class="d-weeks" x="235" y="238">Weeks 1–4</text>
        </g>

        <!-- AUDIO -->
        <g class="district" data-section="audio" tabindex="0" role="button"
           aria-label="Audio. Weeks 5 to 8. Select to view weekly modules.">
          <rect class="zone au" x="130" y="360" width="230" height="170" rx="22" filter="url(#soft)"/>
          <g class="icon" transform="translate(168 392)">
            <!-- microphone -->
            <rect x="14" y="0" width="20" height="34" rx="10" fill="#ffffff"/>
            <path d="M4 22 a20 20 0 0 0 40 0" fill="none" stroke="#ffffff" stroke-width="4"/>
            <line x1="24" y1="42" x2="24" y2="52" stroke="#ffffff" stroke-width="4"/>
            <line x1="14" y1="52" x2="34" y2="52" stroke="#ffffff" stroke-width="4"/>
          </g>
          <text class="d-title" x="245" y="475">Audio</text>
          <text class="d-weeks" x="245" y="503">Weeks 5–8</text>
        </g>

        <!-- VIDEO -->
        <g class="district" data-section="video" tabindex="0" role="button"
           aria-label="Video. Weeks 9 to 11. Select to view weekly modules.">
          <rect class="zone vi" x="415" y="455" width="230" height="170" rx="22" filter="url(#soft)"/>
          <g class="icon" transform="translate(450 487)">
            <!-- film / play -->
            <rect x="0" y="0" width="52" height="38" rx="8" fill="#ffffff"/>
            <path d="M20 9 L38 19 L20 29 Z" fill="#b8452b"/>
          </g>
          <text class="d-title" x="530" y="570">Video</text>
          <text class="d-weeks" x="530" y="598">Weeks 9–11</text>
        </g>

        <!-- CHICAGO 2125 -->
        <g class="district" data-section="chicago2125" tabindex="0" role="button"
           aria-label="Chicago 2125. Weeks 12 to 15. Select to view weekly modules.">
          <rect class="zone ch" x="640" y="235" width="250" height="180" rx="22" filter="url(#soft)"/>
          <g class="icon" transform="translate(672 262)">
            <!-- futuristic skyline -->
            <rect x="0"  y="20" width="14" height="26" fill="#ffffff"/>
            <rect x="18" y="8"  width="14" height="38" fill="#ffffff"/>
            <rect x="36" y="16" width="14" height="30" fill="#ffffff"/>
            <rect x="54" y="2"  width="12" height="44" fill="#ffffff"/>
            <path d="M60 2 L60 -8" stroke="#ffd166" stroke-width="3"/>
            <circle cx="60" cy="-11" r="3" fill="#ffd166"/>
          </g>
          <text class="d-title" x="765" y="352">Chicago 2125</text>
          <text class="d-weeks" x="765" y="380">Weeks 12–15</text>
        </g>

        <!-- Title card — drawn LAST so it is the top-most layer; the solid white
             box keeps road/route lines from crossing the title. -->
        <g class="title-card">
          <rect class="title-box" x="20" y="6" width="702" height="74" rx="14" filter="url(#soft)"/>
          <text class="banner" x="42" y="40">EPSY/CI 423 · Digital Environmental Storytelling &amp; Advocacy</text>
          <text class="subbanner" x="42" y="63">Click a district to explore its weekly modules</text>
        </g>
      </svg>
    </div>

    <!-- ================= WEEK PANEL (populated from config.js) ================= -->
    <div id="panel-backdrop" class="panel-backdrop" hidden></div>
    <aside id="week-panel" class="week-panel" role="dialog" aria-modal="true"
           aria-labelledby="panel-title" hidden>
      <div class="panel-header">
        <button id="panel-close" class="panel-close" aria-label="Close">&times;</button>
        <h2 id="panel-title" class="panel-title"></h2>
        <p id="panel-range" class="panel-range"></p>
      </div>
      <ul id="panel-weeks" class="panel-weeks"></ul>
      <div class="scroll-hint" aria-hidden="true">▾ scroll for more</div>
    </aside>

    <!-- ================= ACCESSIBLE FALLBACK (screen-reader only; not shown visually) ======= -->
    <nav id="fallback-nav" class="fallback-nav sr-only" aria-label="Course modules (text navigation)">
      <!-- Built by app.js from config.js; static markup here is a last-resort note. -->
      <noscript>
        <p>Enable JavaScript to use the interactive map, or use your course Modules page to navigate.</p>
      </noscript>
    </nav>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
