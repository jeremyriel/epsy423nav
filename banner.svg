<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- ============================================================
       Course banner — Chicago's Environmental Storyworlds
       Horizontal vector art. Palette matches the navigation map.
       Edit the title text near the bottom of this file if needed.
       ============================================================ -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#bfe6de"/>
      <stop offset="0.55" stop-color="#dfeede"/>
      <stop offset="1"   stop-color="#ffe4c6"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff4cc"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1"   stop-color="#ffb703"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa9c6"/>
      <stop offset="1" stop-color="#3f6f92"/>
    </linearGradient>
    <linearGradient id="parkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57b88f"/>
      <stop offset="1" stop-color="#2f8f70"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="420" fill="url(#skyGrad)"/>

  <!-- Soft clouds (upper-left) -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="250" cy="70" rx="64" ry="20"/>
    <ellipse cx="300" cy="62" rx="42" ry="16"/>
    <ellipse cx="470" cy="48" rx="50" ry="15"/>
  </g>

  <!-- Sun + halo (upper-right) -->
  <circle cx="1180" cy="140" r="118" fill="#ffe8b0" opacity="0.45"/>
  <circle cx="1180" cy="140" r="82" fill="url(#sunGrad)"/>

  <!-- Distant skyline (back layer) -->
  <g fill="#6274ad" opacity="0.75">
    <rect x="630" y="250" width="55" height="80"/>
    <rect x="690" y="225" width="40" height="105"/>
    <rect x="740" y="245" width="48" height="85"/>
    <rect x="800" y="210" width="60" height="120"/>
    <rect x="880" y="240" width="44" height="90"/>
    <rect x="930" y="220" width="70" height="110"/>
    <rect x="1010" y="250" width="50" height="80"/>
    <rect x="1070" y="230" width="40" height="100"/>
    <rect x="1120" y="215" width="64" height="115"/>
    <rect x="1200" y="245" width="48" height="85"/>
    <rect x="1260" y="225" width="58" height="105"/>
    <rect x="1330" y="250" width="44" height="80"/>
    <rect x="1385" y="235" width="60" height="95"/>
    <rect x="1455" y="250" width="40" height="80"/>
  </g>

  <!-- Downtown skyline (front layer) -->
  <g fill="#26345f">
    <rect x="600" y="272" width="46" height="58"/>

    <!-- Hancock-style tapered tower -->
    <polygon points="700,330 716,206 752,206 768,330"/>
    <line x1="726" y1="206" x2="726" y2="180" stroke="#26345f" stroke-width="4"/>
    <line x1="742" y1="206" x2="742" y2="176" stroke="#26345f" stroke-width="4"/>

    <rect x="788" y="262" width="40" height="68"/>

    <!-- Willis-style stacked tower -->
    <rect x="856" y="250" width="96" height="80"/>
    <rect x="876" y="205" width="56" height="125"/>
    <rect x="892" y="172" width="26" height="158"/>
    <line x1="900" y1="172" x2="900" y2="140" stroke="#26345f" stroke-width="4"/>
    <line x1="912" y1="172" x2="912" y2="146" stroke="#26345f" stroke-width="4"/>

    <rect x="980" y="258" width="42" height="72"/>

    <!-- Marina City "corncob" towers -->
    <path d="M1035 330 V243 a18 18 0 0 1 36 0 V330 Z"/>
    <path d="M1080 330 V243 a18 18 0 0 1 36 0 V330 Z"/>

    <rect x="1130" y="250" width="50" height="80"/>

    <!-- Slanted-roof tower -->
    <polygon points="1196,330 1196,232 1250,210 1250,330"/>

    <rect x="1266" y="262" width="40" height="68"/>
    <rect x="1316" y="245" width="58" height="85"/>
    <rect x="1384" y="258" width="44" height="72"/>
  </g>

  <!-- Lit windows (warm accents) -->
  <g fill="#ffd47a" opacity="0.9">
    <rect x="864" y="262" width="6" height="9"/><rect x="878" y="262" width="6" height="9"/>
    <rect x="900" y="220" width="6" height="9"/><rect x="900" y="240" width="6" height="9"/>
    <rect x="712" y="240" width="5" height="8"/><rect x="736" y="260" width="5" height="8"/>
    <rect x="1140" y="270" width="6" height="9"/><rect x="1158" y="288" width="6" height="9"/>
    <rect x="1330" y="262" width="6" height="9"/><rect x="1352" y="278" width="6" height="9"/>
  </g>

  <!-- Wind turbine (clean-energy / future) -->
  <g stroke="#3a4c86" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="1470" y1="330" x2="1470" y2="214"/>
    <line x1="1470" y1="210" x2="1470" y2="166"/>
    <line x1="1470" y1="210" x2="1432" y2="234"/>
    <line x1="1470" y1="210" x2="1508" y2="234"/>
  </g>
  <circle cx="1470" cy="210" r="5" fill="#3a4c86"/>

  <!-- Lake Michigan -->
  <rect x="0" y="330" width="1600" height="48" fill="url(#waterGrad)"/>
  <g stroke="#ffffff" opacity="0.22" stroke-width="3" stroke-linecap="round">
    <path d="M60 350 q20 -6 40 0 t40 0 t40 0" fill="none"/>
    <path d="M300 364 q20 -6 40 0 t40 0 t40 0" fill="none"/>
    <path d="M1290 352 q20 -6 40 0 t40 0" fill="none"/>
  </g>
  <!-- Sun reflection -->
  <g fill="#fff2cc" opacity="0.5">
    <rect x="1150" y="336" width="60" height="4" rx="2"/>
    <rect x="1156" y="346" width="48" height="4" rx="2"/>
    <rect x="1150" y="356" width="60" height="4" rx="2"/>
    <rect x="1160" y="366" width="40" height="4" rx="2"/>
  </g>

  <!-- Foreground lakefront park -->
  <path d="M0 420 L0 384 Q 260 366 560 380 T 1120 378 T 1600 384 L1600 420 Z" fill="url(#parkGrad)"/>

  <!-- Trees -->
  <g>
    <rect x="536" y="352" width="8" height="34" fill="#6b4a35"/>
    <circle cx="540" cy="350" r="30" fill="#3f9f79"/>
    <circle cx="524" cy="358" r="20" fill="#4fb488"/>
    <circle cx="556" cy="358" r="20" fill="#4fb488"/>

    <rect x="616" y="366" width="6" height="26" fill="#6b4a35"/>
    <circle cx="619" cy="366" r="22" fill="#43a67e"/>

    <rect x="1418" y="366" width="6" height="26" fill="#6b4a35"/>
    <circle cx="1421" cy="366" r="21" fill="#43a67e"/>
    <circle cx="1406" cy="372" r="14" fill="#54b98c"/>
  </g>

  <!-- Cattails / reeds -->
  <g stroke="#2f8f70" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="392" x2="70" y2="366"/><ellipse cx="70" cy="362" rx="4" ry="9" fill="#7a5a3a" stroke="none"/>
    <line x1="82" y1="392" x2="82" y2="372"/><ellipse cx="82" cy="368" rx="4" ry="8" fill="#7a5a3a" stroke="none"/>
  </g>

  <!-- ===================== TITLE ===================== -->
  <text x="72" y="92" font-size="24" font-weight="700" fill="#2f8f70" letter-spacing="3">EPSY / CI 423</text>
  <text x="70" y="150" font-size="47" font-weight="800" fill="#173f38">Digital Environmental</text>
  <text x="70" y="204" font-size="47" font-weight="800" fill="#173f38">Storytelling &amp; Advocacy</text>
  <text x="72" y="242" font-size="20" font-weight="600" fill="#356b60" letter-spacing="0.4">Podcasts &#183; Video &#183; Visual &#183; Web &#183; Social Media</text>

  <!-- ===================== MEDIA BADGES ===================== -->
  <!-- connecting line -->
  <path d="M100 300 H452" stroke="#356b60" stroke-width="2" stroke-dasharray="2 9" opacity="0.55"/>

  <!-- Audio / podcast -->
  <g>
    <circle cx="100" cy="300" r="28" fill="#ffffff"/>
    <circle cx="100" cy="300" r="28" fill="none" stroke="#6a5acd" stroke-width="2"/>
    <rect x="93" y="286" width="14" height="22" rx="7" fill="#6a5acd"/>
    <path d="M87 300 a13 13 0 0 0 26 0" fill="none" stroke="#6a5acd" stroke-width="3"/>
    <line x1="100" y1="313" x2="100" y2="319" stroke="#6a5acd" stroke-width="3"/>
  </g>
  <!-- Video -->
  <g>
    <circle cx="188" cy="300" r="28" fill="#ffffff"/>
    <circle cx="188" cy="300" r="28" fill="none" stroke="#e76f51" stroke-width="2"/>
    <rect x="174" y="289" width="28" height="22" rx="5" fill="#e76f51"/>
    <path d="M184 295 L196 300 L184 305 Z" fill="#ffffff"/>
  </g>
  <!-- Visual / photo -->
  <g>
    <circle cx="276" cy="300" r="28" fill="#ffffff"/>
    <circle cx="276" cy="300" r="28" fill="none" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="263" y="291" width="26" height="19" rx="4" fill="#2a9d8f"/>
    <rect x="270" y="287" width="12" height="6" rx="2" fill="#2a9d8f"/>
    <circle cx="276" cy="300" r="6" fill="#ffffff"/>
    <circle cx="276" cy="300" r="3" fill="#2a9d8f"/>
  </g>
  <!-- Web -->
  <g>
    <circle cx="364" cy="300" r="28" fill="#ffffff"/>
    <circle cx="364" cy="300" r="28" fill="none" stroke="#3f5aa6" stroke-width="2"/>
    <circle cx="364" cy="300" r="13" fill="none" stroke="#3f5aa6" stroke-width="2.5"/>
    <ellipse cx="364" cy="300" rx="5.5" ry="13" fill="none" stroke="#3f5aa6" stroke-width="2.5"/>
    <line x1="351" y1="300" x2="377" y2="300" stroke="#3f5aa6" stroke-width="2.5"/>
  </g>
  <!-- Social -->
  <g>
    <circle cx="452" cy="300" r="28" fill="#ffffff"/>
    <circle cx="452" cy="300" r="28" fill="none" stroke="#f4a259" stroke-width="2"/>
    <path d="M438 291 h28 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-16 l-8 7 v-7 h-4 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 Z" fill="#f4a259"/>
    <circle cx="446" cy="300" r="2" fill="#ffffff"/><circle cx="453" cy="300" r="2" fill="#ffffff"/><circle cx="460" cy="300" r="2" fill="#ffffff"/>
  </g>
</svg>
